name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mini_ecommerce_test
          MYSQL_USER: mini_ecommerce
          MYSQL_PASSWORD: mini_ecommerce_password
          MYSQL_ROOT_PASSWORD: root_password
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot_password"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: mini_ecommerce
      DB_PASSWORD: mini_ecommerce_password
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Client install, lint, and build
        working-directory: client
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Server install, lint, and build
        working-directory: server
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Run migrations on test database
        working-directory: server
        env:
          DB_NAME: mini_ecommerce_test
        run: npm run migration:run
      - name: Run unit tests
        working-directory: server
        run: npm run test
      - name: Run MySQL e2e tests
        working-directory: server
        env:
          DB_NAME: mini_ecommerce_ci_dev
          DB_NAME_TEST: mini_ecommerce_test
        run: npm run test:e2e
